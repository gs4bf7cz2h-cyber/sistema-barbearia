<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Barbearia - Agendamento</title><link rel="stylesheet" href="src/styles.css"></head><body><header class="top"><div><span class="eyebrow">Sistema da Barbearia</span><h1>Agende seu horário</h1></div><nav><a href="#cliente">Cliente</a><a href="#admin">Admin</a></nav></header><main><section id="cliente" class="card hero"><h2>Novo agendamento</h2><p>Escolha serviço, data e horário. Horários ocupados ou bloqueados não aparecem.</p><form id="bookingForm" class="grid"><label>Serviço<select id="serviceSelect" required></select></label><label>Dia<input id="dateInput" type="date" required></label><label>Horário<select id="timeSelect" required></select></label><label>Nome<input id="nameInput" autocomplete="name" required placeholder="Seu nome"></label><label>Telefone<input id="phoneInput" inputmode="tel" autocomplete="tel" required placeholder="(00) 00000-0000"></label><button class="primary" type="submit">Confirmar agendamento</button></form><div id="confirmation" class="confirmation hidden"></div></section><section id="admin" class="card"><div class="section-title"><div><span class="eyebrow">Administração</span><h2>Painel do barbeiro</h2></div><button id="seedButton" type="button">Restaurar dados iniciais</button></div><div class="admin-grid"><form id="serviceForm" class="panel"><h3>Serviços</h3><input type="hidden" id="serviceId"><label>Nome<input id="serviceName" required></label><label>Preço (R$)<input id="servicePrice" type="number" min="0" step="1" required></label><button type="submit">Salvar serviço</button><div id="servicesList" class="list"></div></form><form id="blockForm" class="panel"><h3>Bloquear horário/dia</h3><label>Dia<input id="blockDate" type="date" required></label><label>Horário opcional<select id="blockTime"><option value="">Dia inteiro</option></select></label><label>Motivo<input id="blockReason" placeholder="Folga, manutenção..."></label><button type="submit">Bloquear</button><div id="blocksList" class="list"></div></form></div><div class="panel"><div class="section-title"><h3>Agendamentos por dia</h3><label>Filtrar dia<input id="adminDate" type="date"></label></div><div id="appointmentsList" class="list"></div></div></section></main><template id="editTemplate"><form class="edit-form"><label>Data<input name="date" type="date" required></label><label>Horário<select name="time" required></select></label><button>Salvar</button></form></template><script type="module" src="src/app.js"></script></body></html>
